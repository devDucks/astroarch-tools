# Liste des logiciels proposés par astroarch-software-installer.
#
# Chaque [[package]] décrit un logiciel :
#   name         (obligatoire) nom exact du paquet pacman
#   title        (facultatif)  titre affiché ; sinon on affiche `name`
#   description  (facultatif)  texte de secours, en anglais. La description du
#                              dépôt (pacman -Si) est utilisée en priorité ;
#                              ce texte ne sert que si le dépôt n'en donne pas.
#   category     (facultatif)  regroupement affiché dans le filtre
#   aur          (facultatif)  true = paquet de l'AUR, installé avec paru (la description
#                              du dépôt n'est pas disponible : celle du fichier est utilisée)
#
# Exemple de contenu : à adapter.

