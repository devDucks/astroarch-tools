[package]
name = "astroarch-pi-monitor-qml"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "QML plugin org.astroarch.pimonitor: the Raspberry Pi monitor's values for QML (used by the Plasma widget)"

# A dynamic QML plugin: the library is named after the module's URI
# (`optional plugin org_astroarch_pimonitor` in the generated qmldir)
[lib]
name = "org_astroarch_pimonitor"
crate-type = ["cdylib"]

[dependencies]
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }
astroarch-pi-monitor = { path = "../astroarch-pi-monitor" }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
zbus = { workspace = true }

[build-dependencies]
cxx-qt-build = { workspace = true }
