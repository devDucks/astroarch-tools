[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

# Versions common to all crates
[workspace.dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
cxx-qt-lib-extras = "0.10"
# link_qt_object_files: required by cxx-qt 0.10 for objects
# Qt initialization [code/data] are included in the binary (100% Cargo-based build)
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = "1"

# Internal crate (shared build.rs)
astroarch-build = { path = "crates/astroarch-build" }
